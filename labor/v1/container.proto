syntax = "proto3";

package labor.v1;

option go_package = "digital-labor/proto";

// 数字助理容器服务
// 一个 Agent 绑定一个 Session，agent_id 即 session_id
service ContainerService {
  // --- 容器 ---
  rpc StartService(StartServiceRequest) returns (StartServiceResponse);
  rpc StopService(StopServiceRequest) returns (StopServiceResponse);
  rpc RestartService(RestartServiceRequest) returns (RestartServiceResponse);
  rpc RemoveService(RemoveServiceRequest) returns (RemoveServiceResponse);
  rpc BackupService(BackupServiceRequest) returns (stream BackupServiceResponse);

  // --- 模型 ---
  rpc CreateChatModel(CreateChatModelRequest) returns (CreateChatModelResponse);
  rpc RemoveChatModel(RemoveChatModelRequest) returns (RemoveChatModelResponse);

  // --- 智能体 ---
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  rpc RemoveAgent(RemoveAgentRequest) returns (RemoveAgentResponse);

  // --- 会话 (agent 维度) ---
  rpc GetAgentSession(GetAgentSessionRequest) returns (GetAgentSessionResponse);
  rpc ClearAgentHistory(ClearAgentHistoryRequest) returns (ClearAgentHistoryResponse);
  rpc CompressAgentHistory(CompressAgentHistoryRequest) returns (CompressAgentHistoryResponse);

  // --- Skill管理 ---
  rpc AddSkill(AddSkillRequest) returns (AddSkillResponse);
  rpc GetAllSkills(GetAllSkillsRequest) returns (GetAllSkillsResponse);
  rpc DisableSkill(DisableSkillRequest) returns (DisableSkillResponse);
  rpc EnableSkill(EnableSkillRequest) returns (EnableSkillResponse);

  // --- MCP管理 ---
  rpc AddMCP(AddMCPRequest) returns (AddMCPResponse);
  rpc GetAllMCPs(GetAllMCPsRequest) returns (GetAllMCPsResponse);
  rpc DisableMCP(DisableMCPRequest) returns (DisableMCPResponse);
  rpc EnableMCP(EnableMCPRequest) returns (EnableMCPResponse);

  // --- 通道管理 ---
  rpc GetAllChannels(GetAllChannelsRequest) returns (GetAllChannelsResponse);
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse);
  rpc RemoveChannel(RemoveChannelRequest) returns (RemoveChannelResponse);
  rpc EnableChannel(EnableChannelRequest) returns (EnableChannelResponse);
  rpc DisableChannel(DisableChannelRequest) returns (DisableChannelResponse);

  // --- 对话 ---
  rpc SendMessage(SendMessageRequest) returns (stream SendMessageResponse);

  // --- 任务 ---
  rpc StopTask(StopTaskRequest) returns (StopTaskResponse);
  rpc GetTaskStatus(GetTaskStatusRequest) returns (GetTaskStatusResponse);
}

// --- 消息定义 ---
message StartServiceRequest {
  string container_id = 1;
  string agent_id = 2;
}
message StartServiceResponse {
  bool success = 1;
  string message = 2;
}
message StopServiceRequest {}
message StopServiceResponse {
  bool success = 1;
  string message = 2;
}
message RestartServiceRequest {}
message RestartServiceResponse {
  bool success = 1;
  string message = 2;
}
message RemoveServiceRequest {}
message RemoveServiceResponse {
  bool success = 1;
  string message = 2;
}
message BackupServiceRequest {}
message BackupServiceResponse {
  bytes data = 1;
  int32 chunk_number = 2;
}

// --- 模型 ---
message CreateChatModelRequest {
  string model_name = 1;
  string key = 2;
  string base_url = 3;
  string provider = 4;
}
message CreateChatModelResponse {
  bool success = 1;
  string chat_model_id = 2;
  string message = 3;
}
message RemoveChatModelRequest {
  string chat_model_id = 1;
}
message RemoveChatModelResponse {
  bool success = 1;
  string message = 2;
}

// --- 智能体 ---
message CreateAgentRequest {
  string agent_name = 1;
  string chat_model_id = 2;
}
message CreateAgentResponse {
  string agent_id = 1;
  bool success = 2;
  string message = 3;
}
message RemoveAgentRequest {
  string agent_id = 1;
}
message RemoveAgentResponse {
  bool success = 1;
  string message = 2;
}

// --- 会话 ---
message GetAgentSessionRequest {
  string agent_id = 1;
}
message Message {
  string role = 1;
  string content = 2;
  string timestamp = 3;
  string kind = 4;
}
message GetAgentSessionResponse {
  string agent_id = 1;
  repeated Message messages = 2;
}
message ClearAgentHistoryRequest {
  string agent_id = 1;
}
message ClearAgentHistoryResponse {
  bool success = 1;
  string message = 2;
}
message CompressAgentHistoryRequest {
  string agent_id = 1;
}
message CompressAgentHistoryResponse {
  bool success = 1;
  string message = 2;
}

// --- 对话 ---
message SendMessageRequest {
  string agent_id = 1;
  string message = 2;
  bool is_stream = 3;
}
message SendMessageResponse {
  string delta_content = 1;
  bool is_final = 2;
}

// --- 工具 ---
message AddMCPRequest {
  string url = 1;
  string provider = 2;
}
message AddMCPResponse {
  bool success = 1;
  string message = 2;
}

// --- 任务 ---
message StopTaskRequest {
  string agent_id = 1;
}
message StopTaskResponse {
  bool success = 1;
}
message GetTaskStatusRequest {
  string agent_id = 1;
}
message GetTaskStatusResponse {
  string agent_id = 1;
  string status = 2; // e.g., "thinking", "calling_tool", "idle"
  string last_action = 3;
}

// --- Skill ---
message AddSkillRequest {
  string name = 1;
  string description = 2;
  string agent_id = 3;
}
message AddSkillResponse {
  bool success = 1;
  string message = 2;
}
message SkillInfo {
  string name = 1;
  string description = 2;
  bool enabled = 3;
}
message GetAllSkillsRequest {
  string agent_id = 1;
}
message GetAllSkillsResponse {
  repeated SkillInfo skills = 1;
}
message DisableSkillRequest {
  string skill_name = 1;
  string agent_id = 2;
}
message DisableSkillResponse {
  bool success = 1;
  string message = 2;
}
message EnableSkillRequest {
  string skill_name = 1;
  string agent_id = 2;
}
message EnableSkillResponse {
  bool success = 1;
  string message = 2;
}

// --- MCP ---
message MCPInfo {
  string url = 1;
  string name = 2;
  bool enabled = 3;
}
message GetAllMCPsRequest {}
message GetAllMCPsResponse {
  repeated MCPInfo mcps = 1;
}
message DisableMCPRequest {
  string url = 1;
}
message DisableMCPResponse {
  bool success = 1;
  string message = 2;
}
message EnableMCPRequest {
  string url = 1;
}
message EnableMCPResponse {
  bool success = 1;
  string message = 2;
}

// --- 通道 ---
message ChannelInfo {
  string kind = 1;
  bool enabled = 2;
  string description = 3;
}
message GetAllChannelsRequest {}
message GetAllChannelsResponse {
  repeated ChannelInfo channels = 1;
}
message CreateChannelRequest {
  string kind = 1;
  map<string, string> params = 2;
}
message CreateChannelResponse {
  bool success = 1;
  string message = 2;
}
message RemoveChannelRequest {
  string kind = 1;
}
message RemoveChannelResponse {
  bool success = 1;
  string message = 2;
}
message EnableChannelRequest {
  string kind = 1;
}
message EnableChannelResponse {
  bool success = 1;
  string message = 2;
}
message DisableChannelRequest {
  string kind = 1;
}
message DisableChannelResponse {
  bool success = 1;
  string message = 2;
}
