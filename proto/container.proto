syntax = "proto3";

package labor;

option go_package = "labor.v1";

// 容器与会话管理服务
service ContainerService {
  // --- 容器相关 ---
  rpc StartService(StartServiceRequest) returns (StartServiceResponse);
  rpc StopService(StopServiceRequest) returns (StopServiceResponse);
  rpc RestartService(RestartServiceRequest) returns (RestartServiceResponse);
  rpc RemoveService(RemoveServiceRequest) returns (RemoveServiceResponse);
  rpc BackupService(BackupServiceRequest) returns (BackupServiceResponse);

  // --- 会话相关 ---
  rpc GetOrCreateSession(GetOrCreateSessionRequest) returns (GetOrCreateSessionResponse);
  rpc RemoveSession(RemoveSessionRequest) returns (RemoveSessionResponse);
  rpc CompressSession(CompressSessionRequest) returns (CompressSessionResponse);

  // --- 对话相关 ---
  // 使用 stream 返回，支持打字机效果或长时生成
  rpc SendMessageToSession(SendMessageToSessionRequest) returns (stream SendMessageToSessionResponse);

  // --- 任务相关 ---
  rpc StopTask(StopTaskRequest) returns (StopTaskResponse);

  // --- MCP 相关 ---
  rpc CreateMCP(CreateMCPRequest) returns (CreateMCPResponse);
  rpc DisableMCP(DisableMCPRequest) returns (DisableMCPResponse);
  rpc RemoveMCP(RemoveMCPRequest) returns (RemoveMCPResponse);
}

// --- 消息定义 (遵循唯一性原则) ---

message StartServiceRequest {
  string container_id = 1;
  string agent_id = 2;
  string key = 3;
  string url = 4;
  string model_name = 5;
  string provider = 6;
  string agent_kind = 7;
  bool vnc_enabled = 8;
  bool ftp_enabled = 9;
}
message StartServiceResponse {
  int32 visual_display_port = 1;
  int32 ftp_port = 2;
  bool success = 3;
}

// Service Messages
message StopServiceRequest {
  string container_id = 1;
  string agent_id = 2;
  string session_id = 3;
}
message StopServiceResponse {
  bool success = 1;
}

message RestartServiceRequest {
  string container_id = 1;
  string agent_id = 2;
}
message RestartServiceResponse {
  bool success = 1;
}

message RemoveServiceRequest {
  string container_id = 1;
  string agent_id = 2;
}
message RemoveServiceResponse {
  bool success = 1;
}

message BackupServiceRequest {
  string container_id = 1;
  string agent_id = 2;
}
message BackupServiceResponse {
  string backup_url = 1;
}

// Session Messages
message GetOrCreateSessionRequest {
  string container_id = 1;
  string agent_id = 2;
  string session_id = 3;
}
message Message {
  string role = 1;
  string content = 2;
  string timestamp = 3;
  string kind = 4;
}
message GetOrCreateSessionResponse {
  string session_id = 1;
  repeated Message messages = 2;
}

message CompressSessionRequest {
  string container_id = 1;
  string agent_id = 2;
  string session_id = 3;
}
message CompressSessionResponse {
  string session_id = 1;
  bool success = 2;
}

message RemoveSessionRequest {
  string container_id = 1;
  string agent_id = 2;
  string session_id = 3;
}
message RemoveSessionResponse {
  bool success = 1;
}

// Dialogue Messages
message SendMessageToSessionRequest {
  string container_id = 1;
  string agent_id = 2;
  string session_id = 3;
  string message = 4;
  bool is_stream = 5;
}
message SendMessageToSessionResponse {
  string delta_content = 1; // 流式返回时的片段内容
  bool is_final = 2; // 是否是最后一段
}

// Task Messages
message StopTaskRequest {
  string container_id = 1;
  string agent_id = 2;
  string session_id = 3;
}
message StopTaskResponse {
  bool success = 1;
}

// MCP Messages
message CreateMCPRequest {
  string container_id = 1;
  string agent_id = 2;
  string mcp_name = 3;
  string description = 4;
  map<string, string> metadata = 5;
}
message CreateMCPResponse {
  string mcp_id = 1;
}

message DisableMCPRequest {
  string container_id = 1;
  string agent_id = 2;
  string mcp_id = 3;
}
message DisableMCPResponse {
  bool success = 1;
}

message RemoveMCPRequest {
  string container_id = 1;
  string agent_id = 2;
  string mcp_id = 3;
}
message RemoveMCPResponse {
  bool success = 1;
}
